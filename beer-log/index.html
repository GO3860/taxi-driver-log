<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<title>マイ・ビールログ</title>
<style>
:root{--green:#173f35;--green2:#245b49;--cream:#f6f5ef;--card:#fff;--ink:#202821;--muted:#6d776f;--line:#e1e6df;--gold:#e5b94f;--red:#b83e35}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 42px}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:white;padding:22px 20px;border-radius:20px;margin-bottom:16px;box-shadow:0 8px 24px #173f351a}
.brand{font-size:12px;letter-spacing:.12em;opacity:.8}.title{font-size:26px;font-weight:800;margin:5px 0 4px}.subtitle{font-size:13px;opacity:.86}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #243c2b08}
h2{font-size:17px;margin:0 0 13px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input,select,button{font:inherit}
input[type=date],input[type=number],select{width:100%;border:1px solid #d5ddd5;border-radius:11px;background:white;padding:12px;color:var(--ink);min-height:46px}
.field{margin-bottom:13px}
.cans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.can{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcf8}
.can .size{font-weight:800;font-size:17px}.can .price{font-size:12px;color:var(--muted);margin:3px 0 9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer;min-height:44px}
.primary{background:var(--green);color:#fff;flex:1}.secondary{background:#edf1eb;color:var(--green)}.danger{background:#fff0ee;color:var(--red);padding:8px 11px;min-height:36px}
.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{padding:13px;border-radius:13px;background:#f3f6f0;border:1px solid #e6ece3}
.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}.stat .unit{font-size:12px;font-weight:500}
.stat.money{background:#fff8e7;border-color:#f1e5bf}.stat.wide{grid-column:1/-1}
.periods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.breakdown{font-size:13px;color:var(--muted);line-height:1.8;margin-top:10px}
.record{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.record:first-child{border-top:0;padding-top:0}.record-date{font-weight:750}.record-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}.record-right{text-align:right;white-space:nowrap}.record-cost{font-weight:800}
.empty{padding:20px 8px;text-align:center;color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:12px}
@media(max-width:390px){.wrap{padding:12px 10px 32px}.card{padding:13px}.stat .num{font-size:19px}.title{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">PERSONAL TRACKER</div><div class="title">🍺 マイ・ビールログ</div><div class="subtitle">飲んだ本数と、ビールに使ったお金を見える化</div></header>
<section class="card">
<h2 id="formTitle">今日の記録</h2>
<div class="field"><label for="drinkDate">日付</label><input id="drinkDate" type="date" required></div>
<div class="cans">
<div class="can"><div class="size">350ml 缶</div><div class="price">220円／本</div><label for="qty350">本数</label><input id="qty350" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="0" value="0"></div>
<div class="can"><div class="size">500ml 缶</div><div class="price">290円／本</div><label for="qty500">本数</label><input id="qty500" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="0" value="0"></div>
</div>
<div class="actions"><button class="primary" id="saveBtn">記録を保存</button><button class="secondary" id="clearBtn" type="button">入力をクリア</button></div>
<div class="notice">同じ日付の記録を保存すると、その日の記録を更新します。飲まなかった日は入力しなくても大丈夫。</div>
</section>
<section class="card">
<h2>📊 集計</h2>
<div class="periods">
<div><label for="monthPick">月間集計</label><input id="monthPick" type="month"></div>
<div><label for="yearPick">年間集計</label><select id="yearPick"></select></div>
</div>
<div style="margin-top:14px;font-weight:750" id="monthHeading">今月</div>
<div class="stats" id="monthStats" style="margin-top:9px"></div>
<div class="breakdown" id="monthBreakdown"></div>
<div style="margin-top:18px;font-weight:750" id="yearHeading">今年</div>
<div class="stats" id="yearStats" style="margin-top:9px"></div>
<div class="breakdown" id="yearBreakdown"></div>
</section>
<section class="card">
<h2>🗓️ 記録一覧</h2>
<div class="field"><label for="listFilter">表示する記録</label><select id="listFilter"><option value="month">選択した月</option><option value="year">選択した年</option><option value="all">すべて</option></select></div>
<div id="records"></div>
</section>
<footer>記録はこのブラウザの端末内に保存されます。ブラウザのデータ消去や端末変更に備えて、記録を定期的にバックアップしてください。</footer>
</div>
<script>
(function(){
'use strict';
const KEY='myBeerLogRecords_v1';
const PRICE350=220, PRICE500=290;
const $=id=>document.getElementById(id);
const today=new Date();
const localDate=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const fmt=n=>Number(n||0).toLocaleString('ja-JP');
const yen=n=>fmt(n)+'円';
const monthNow=localDate(today).slice(0,7);
let records=loadRecords(), editingDate=null;
function loadRecords(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v.filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)).map(r=>({date:r.date,q350:Math.max(0,parseInt(r.q350,10)||0),q500:Math.max(0,parseInt(r.q500,10)||0)})):[]}catch(e){return []}}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
function cost(r){return r.q350*PRICE350+r.q500*PRICE500}
function total(rows){return rows.reduce((a,r)=>({q350:a.q350+r.q350,q500:a.q500+r.q500,cost:a.cost+cost(r),days:a.days+1}),{q350:0,q500:0,cost:0,days:0})}
function setDefaultDate(){ $('drinkDate').value=localDate(new Date()); }
function dateLabel(s){const [y,m,d]=s.split('-').map(Number);return y+'年'+m+'月'+d+'日'}
function monthLabel(s){const [y,m]=s.split('-').map(Number);return y+'年'+m+'月'}
function statCard(label,value,unit,extra){return '<div class="stat '+(extra||'')+'"><div class="label">'+label+'</div><div class="num">'+value+'<span class="unit">'+(unit||'')+'</span></div></div>'}
function renderStats(){
 const m=$('monthPick').value||monthNow, y=$('yearPick').value||String(today.getFullYear());
 const mt=total(records.filter(r=>r.date.startsWith(m))), yt=total(records.filter(r=>r.date.startsWith(y+'-')));
 $('monthHeading').textContent=monthLabel(m)+'の合計';
 $('monthStats').innerHTML=statCard('350ml 本数',fmt(mt.q350),'本')+statCard('500ml 本数',fmt(mt.q500),'本')+statCard('合計本数',fmt(mt.q350+mt.q500),'本')+statCard('ビール代',yen(mt.cost),'','money wide');
 $('monthBreakdown').textContent='350ml：'+yen(mt.q350*PRICE350)+' ／ 500ml：'+yen(mt.q500*PRICE500)+' ／ 記録日数：'+fmt(mt.days)+'日';
 $('yearHeading').textContent=y+'年の合計';
 $('yearStats').innerHTML=statCard('350ml 本数',fmt(yt.q350),'本')+statCard('500ml 本数',fmt(yt.q500),'本')+statCard('合計本数',fmt(yt.q350+yt.q500),'本')+statCard('ビール代',yen(yt.cost),'','money wide');
 $('yearBreakdown').textContent='350ml：'+yen(yt.q350*PRICE350)+' ／ 500ml：'+yen(yt.q500*PRICE500)+' ／ 記録日数：'+fmt(yt.days)+'日';
 renderRecords();
}
function renderRecords(){
 const mode=$('listFilter').value, m=$('monthPick').value||monthNow, y=$('yearPick').value||String(today.getFullYear());
 let rows=records.filter(r=>mode==='all'||(mode==='month'?r.date.startsWith(m):r.date.startsWith(y+'-'))).sort((a,b)=>b.date.localeCompare(a.date));
 const box=$('records');
 if(!rows.length){box.innerHTML='<div class="empty">まだ記録がありません。<br>飲んだ本数を入力して保存してみよう。</div>';return}
 box.innerHTML=rows.map(r=>'<div class="record"><div><div class="record-date">'+dateLabel(r.date)+'</div><div class="record-sub">350ml：'+fmt(r.q350)+'本（'+yen(r.q350*PRICE350)+'）<br>500ml：'+fmt(r.q500)+'本（'+yen(r.q500*PRICE500)+'）</div></div><div class="record-right"><div class="record-cost">'+yen(cost(r))+'</div><div class="record-sub">合計 '+fmt(r.q350+r.q500)+'本</div><div class="actions" style="justify-content:flex-end"><button class="secondary" data-edit="'+r.date+'" style="padding:7px 10px;min-height:34px">修正</button><button class="danger" data-delete="'+r.date+'">削除</button></div></div></div>').join('');
 box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editRecord(b.dataset.edit)));
 box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRecord(b.dataset.delete)));
}
function editRecord(date){const r=records.find(x=>x.date===date);if(!r)return;editingDate=date;$('drinkDate').value=r.date;$('qty350').value=r.q350;$('qty500').value=r.q500;$('formTitle').textContent=dateLabel(date)+'の記録を修正';$('saveBtn').textContent='修正を保存';window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){editingDate=null;setDefaultDate();$('qty350').value='0';$('qty500').value='0';$('formTitle').textContent='今日の記録';$('saveBtn').textContent='記録を保存'}
function deleteRecord(date){const r=records.find(x=>x.date===date);if(!r)return;if(!confirm(dateLabel(date)+'の記録（'+(r.q350+r.q500)+'本、'+yen(cost(r))+'）を削除しますか？'))return;records=records.filter(x=>x.date!==date);persist();if(editingDate===date)resetForm();renderStats()}
$('saveBtn').addEventListener('click',()=>{
 const date=$('drinkDate').value, q350=Number($('qty350').value||0), q500=Number($('qty500').value||0);
 if(!date){alert('日付を選んでください');return}
 if(!Number.isInteger(q350)||!Number.isInteger(q500)||q350<0||q500<0||q350>999||q500>999){alert('本数は0〜999の整数で入力してください');return}
 if(q350+q500===0&&!confirm('本数が0本です。この日の記録を保存しますか？'))return;
 const old=records.findIndex(r=>r.date===date);
 const item={date,q350,q500};
 if(old>=0){if(!confirm(dateLabel(date)+'の既存記録をこの内容に更新しますか？'))return;records[old]=item}
 else records.push(item);
 records.sort((a,b)=>a.date.localeCompare(b.date));persist();
 $('monthPick').value=date.slice(0,7);if(!$('yearPick').querySelector('option[value="'+date.slice(0,4)+'"]'))addYear(date.slice(0,4));$('yearPick').value=date.slice(0,4);
 resetForm();renderStats();alert('記録を保存しました！');
});
$('clearBtn').addEventListener('click',resetForm);
$('monthPick').addEventListener('change',renderStats);
$('yearPick').addEventListener('change',renderStats);
$('listFilter').addEventListener('change',renderRecords);
function addYear(y){const opt=document.createElement('option');opt.value=y;opt.textContent=y+'年';$('yearPick').appendChild(opt)}
function init(){
 setDefaultDate();$('monthPick').value=monthNow;
 const years=new Set([String(today.getFullYear()),...records.map(r=>r.date.slice(0,4))]);[...years].sort((a,b)=>b.localeCompare(a)).forEach(addYear);$('yearPick').value=String(today.getFullYear());
 renderStats();
}
init();
})();
</script>
</body>
</html>
